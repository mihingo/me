summary: A full-stack public-safety platform for police services, bringing occurrence reporting, investigations, case management, assignments, analytics and command dashboards into one system.
highlights:
  - AI-assisted workflows for case analysis, grounded summaries, report intelligence and decision support.
  - "Production-oriented foundation: automated testing, secure connectivity, notifications and a Turborepo/Yarn monorepo."
  - Next.js and Relay over a .NET 8 / HotChocolate GraphQL API, with Entity Framework Core and PostgreSQL.
  - Azure Front Door Premium, WAF and private connectivity, with Keycloak for identity.
outcome: In development. The public reporting portal is live at kenya.psms.africa.
