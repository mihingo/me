caseStudy:
  problem: Police-service workflows span reporting, investigations, case management, assignments and command oversight. PSMS brings these capabilities into a public-safety platform.
  approach: Full-stack development with Next.js, Relay and GraphQL; a .NET 8 / HotChocolate backend; and Entity Framework Core with PostgreSQL. The production-oriented foundation includes automated testing, notifications, Docker, Keycloak, and Azure Front Door Premium, WAF and private connectivity.
  outcomes:
    - The public reporting interface is live at kenya.psms.africa.
    - The wider platform is in development.
  sections:
    - heading: AI-assisted, grounded workflows
      body: Case analysis, grounded summaries, report intelligence and decision support are part of the platform's AI-assisted workflows.
    - heading: An engineering foundation
      body: A Turborepo/Yarn monorepo supports the platform, alongside automated testing, secure connectivity and notifications.
architecture:
